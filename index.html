<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFXII Zodiac Planner</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link href="./styles.css" rel="stylesheet">
</head>

<body>
    <!-- Game Data Modules -->
    <script src="./data/icons.js"></script>
    <script src="./data/jobs.js"></script>
    <script src="./data/characters.js"></script>
    <script src="./data/espers.js"></script>
    <script src="./data/presets.js"></script>


    <div x-data="{
        preset: localStorage.getItem('ffxii_preset') || 'Max Efficiency',
        expanded: JSON.parse(localStorage.getItem('ffxii_expanded') || '{}'),
        selectedParty: parseInt(localStorage.getItem('ffxii_party') || '0'),
        teamView: localStorage.getItem('ffxii_team') || 'A',
        init() {
            this.$watch('preset', val => localStorage.setItem('ffxii_preset', val));
            this.$watch('expanded', val => localStorage.setItem('ffxii_expanded', JSON.stringify(val)));
            this.$watch('selectedParty', val => localStorage.setItem('ffxii_party', val));
            this.$watch('teamView', val => localStorage.setItem('ffxii_team', val));
        },
        get current() { return PRESETS[this.preset]; },
        get groupedPresets() {
            const phases = {
                early: { label: 'Early Game', presets: [] },
                mid: { label: 'Mid to Late Game', presets: [] },
                late: { label: 'Late Game / Endgame', presets: [] }
            };
            Object.entries(PRESETS).forEach(([name, data]) => {
                phases[data.phase].presets.push({ name, data });
            });
            return phases;
        },
        get activePartyMembers() {
            const currentPreset = PRESETS[this.preset];
            if (!currentPreset.parties || currentPreset.parties.length === 0) return null;
            const partyIndex = (this.selectedParty >= 0 && this.selectedParty < currentPreset.parties.length) ? this.selectedParty : 0;
            return currentPreset.parties[partyIndex].members;
        },
        get bTeamMembers() {
            const currentPreset = PRESETS[this.preset];
            if (!currentPreset.parties || currentPreset.parties.length === 0) return null;
            const teamA = this.activePartyMembers;
            if (!teamA) return null;
            const allCharacters = currentPreset.builds.map(b => b.char);
            return allCharacters.filter(char => !teamA.includes(char));
        },
        getPresetIcon(presetName) {
            return Icons[PRESET_ICONS[presetName]];
        },
        isInActiveParty(charName) {
            if (!this.activePartyMembers) return true;
            return this.activePartyMembers.includes(charName);
        },
        isInBTeam(charName) {
            if (!this.bTeamMembers) return false;
            return this.bTeamMembers.includes(charName);
        },
        shouldShowCharacter(charName) {
            if (this.teamView === 'A') {
                return this.isInActiveParty(charName);
            } else {
                return this.isInBTeam(charName);
            }
        },
        isLeader(charName) {
            const currentTeam = this.teamView === 'A' ? this.activePartyMembers : this.bTeamMembers;
            return currentTeam && currentTeam[0] === charName;
        },
        showBuildDetails: false
    }" class="min-h-screen text-white selection:bg-cyan-500/30">

        <!-- FF XII Header -->
        <div class="relative py-8 md:py-12 overflow-hidden border-b border-cyan-500/20"
            style="background: rgba(10, 20, 30, 0.7);">
            <div class="relative max-w-7xl mx-auto px-6">
                <div class="text-center md:text-left">
                    <h1 class="text-4xl md:text-5xl font-bold text-white mb-3 tracking-tight">
                        Zodiac <span class="teal-accent">Planner</span>
                    </h1>
                    <p class="text-gray-300 text-sm md:text-base font-normal">
                        Optimization based on the Unnecessary Class Guide v2.2
                    </p>
                </div>
            </div>
        </div>

        <div class="max-w-7xl mx-auto px-6 py-8 flex flex-col lg:grid lg:grid-cols-12 lg:auto-rows-auto gap-8">

            <!-- Presets - Order 1 on mobile -->
            <div class="order-1 lg:col-span-4 lg:order-none">
                <div class="ff-panel rounded-lg p-2 overflow-hidden">
                    <div class="space-y-4">
                        <template x-for="(phaseData, phaseKey) in groupedPresets" :key="phaseKey">
                            <div x-show="phaseData.presets.length > 0">
                                <!-- Category Header -->
                                <div class="ff-category-header">
                                    <h3 x-text="phaseData.label"></h3>
                                </div>

                                <!-- Presets in this category -->
                                <div class="flex flex-col">
                                    <template x-for="item in phaseData.presets" :key="item.name">
                                        <div class="ff-preset-btn" :class="{ 'active': preset === item.name }">
                                            <button
                                                @click="preset = item.name; expanded = {}; selectedParty = 0; teamView = 'A'; showBuildDetails = false"
                                                class="w-full text-left focus:outline-none group">
                                                <div class="ff-punch-label"
                                                    :class="preset === item.name ? 'ff-punch-text ff-bronze-text' : ''"
                                                    x-text="item.data.shortName || item.name.split(' ')[0]"></div>
                                                <div class="flex flex-col gap-0.5 overflow-hidden">
                                                    <div class="ff-detail-title" x-text="item.name"></div>
                                                    <div class="ff-detail-desc truncate opacity-40 uppercase tracking-tight"
                                                        x-text="item.data.desc"></div>
                                                </div>
                                                <div
                                                    class="text-[10px] opacity-20 group-hover:opacity-100 group-hover:translate-x-1 transition-all">
                                                    ▶</div>
                                            </button>

                                            <!-- Tactical Snapshot Expansion -->
                                            <div x-show="preset === item.name" x-collapse>
                                                <div class="ff-rich-content p-4 space-y-6">
                                                    <!-- Technical Metric Matrix -->
                                                    <div class="grid grid-cols-3 gap-8">
                                                        <div class="flex flex-col">
                                                            <div class="ff-metric-value" x-text="item.data.metrics.lp">
                                                            </div>
                                                            <div class="ff-metric-label mb-2">LP Sync</div>
                                                            <div class="ff-gauge-container !h-1 bg-white/10">
                                                                <div class="ff-gauge-fill bar-system"
                                                                    :style="`width: ${item.data.metrics.lp}%`"></div>
                                                            </div>
                                                        </div>
                                                        <div class="flex flex-col">
                                                            <div class="ff-metric-value" x-text="item.data.metrics.atk">
                                                            </div>
                                                            <div class="ff-metric-label mb-2">Power</div>
                                                            <div class="ff-gauge-container !h-1 bg-white/10">
                                                                <div class="ff-gauge-fill bar-offense"
                                                                    :style="`width: ${item.data.metrics.atk}%`"></div>
                                                            </div>
                                                        </div>
                                                        <div class="flex flex-col">
                                                            <div class="ff-metric-value"
                                                                x-text="item.data.metrics.flex"></div>
                                                            <div class="ff-metric-label mb-2">Flex</div>
                                                            <div class="ff-gauge-container !h-1 bg-white/10">
                                                                <div class="ff-gauge-fill bar-defense"
                                                                    :style="`width: ${item.data.metrics.flex}%`"></div>
                                                            </div>
                                                        </div>
                                                    </div>

                                                    <!-- Synergy Markers -->
                                                    <div
                                                        class="flex flex-wrap gap-2 text-[9px] font-black tracking-widest uppercase">
                                                        <template
                                                            x-for="esper in item.data.requirements.keyEspers.slice(0, 2)">
                                                            <span
                                                                class="bg-[#2a4555] border border-cyan-400/30 px-2 py-1"
                                                                x-text="esper.split(' ')[0]"></span>
                                                        </template>
                                                        <span class="bg-[#2a4555] border border-cyan-400/30 px-2 py-1"
                                                            x-text="item.data.phase"></span>
                                                    </div>

                                                    <!-- Tactical Requirement -->
                                                    <div class="ff-selector-alert">
                                                        <div
                                                            class="font-black text-[10px] uppercase tracking-widest text-[#ffd700] mb-2">
                                                            Tactical Requirement</div>
                                                        <div class="opacity-90" x-text="item.data.requirements.notes">
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>

            <!-- Character Cards - Order 2 on mobile, spans 8 cols + 2 rows on desktop -->
            <div class="order-2 lg:col-span-8 lg:row-span-2 lg:order-none space-y-6 pl-0 lg:pl-4">

                <!-- Build Description -->
                <div class="ff-panel rounded-lg p-6 border-2 border-cyan-500/30">
                    <div class="flex items-start gap-3 mb-6">
                        <div
                            class="flex-shrink-0 w-10 h-10 rounded-full bg-cyan-500/30 border border-cyan-500 flex items-center justify-center">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                class="w-5 h-5 text-cyan-400" x-html="Icons.Book"></svg>
                        </div>
                        <div class="flex-1">
                            <h3 class="text-base font-bold text-cyan-300 mb-2 tracking-tight">Why This Build?</h3>
                            <p class="text-sm text-gray-300 leading-relaxed font-normal mb-4" x-text="current.why"></p>

                            <!-- Mobile Technical Toggle -->
                            <button @click="showBuildDetails = !showBuildDetails"
                                class="flex items-center gap-2 group/toggle py-2 px-4 rounded border border-cyan-500/30 bg-[#102030]/40 hover:bg-cyan-500/20 transition-all">
                                <span class="text-[10px] font-black uppercase tracking-widest text-cyan-400"
                                    x-text="showBuildDetails ? 'Hide Technical Specs' : 'Show Technical Specs'"></span>
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="3"
                                    class="w-3 h-3 text-cyan-400 transition-transform duration-300"
                                    :class="showBuildDetails ? 'rotate-180' : ''">
                                    <path d="M6 9l6 6 6-6" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Build Requirements - Expandable -->
                    <div x-show="showBuildDetails" x-collapse class="border-t border-cyan-500/20 pt-5 mb-6">
                        <div class="flex items-center gap-2 mb-4">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                class="w-5 h-5 text-yellow-400" x-html="Icons.Target"></svg>
                            <h4 class="text-sm font-bold text-yellow-300 uppercase tracking-wider">Build Requirements
                            </h4>
                        </div>

                        <div class="grid md:grid-cols-2 gap-4">
                            <!-- Left Column: Availability & Unlocks -->
                            <div class="space-y-4">
                                <!-- Availability -->
                                <div class="p-3 rounded-lg border border-cyan-500/20"
                                    style="background: rgba(20, 35, 50, 0.5)">
                                    <div class="flex items-center gap-2 mb-2">
                                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                            stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                            stroke-linejoin="round" class="w-4 h-4 text-cyan-400"
                                            x-html="Icons.Clock"></svg>
                                        <span
                                            class="text-xs font-bold text-cyan-300 uppercase tracking-wider">Availability</span>
                                    </div>
                                    <p class="text-sm text-gray-200" x-text="current.requirements.availability"></p>
                                </div>

                                <!-- Unlocks -->
                                <div class="p-3 rounded-lg border border-cyan-500/20"
                                    style="background: rgba(20, 35, 50, 0.5)">
                                    <div class="flex items-center gap-2 mb-2">
                                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                            stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                            stroke-linejoin="round" class="w-4 h-4 text-cyan-400"
                                            x-html="Icons.Unlock"></svg>
                                        <span class="text-xs font-bold text-cyan-300 uppercase tracking-wider">Unlocks
                                            Required</span>
                                    </div>
                                    <p class="text-sm text-gray-200" x-text="current.requirements.unlocks"></p>
                                </div>

                                <!-- Recommended Level -->
                                <div class="p-3 rounded-lg border border-cyan-500/20"
                                    style="background: rgba(20, 35, 50, 0.5)">
                                    <div class="flex items-center gap-2 mb-2">
                                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                            stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                            stroke-linejoin="round" class="w-4 h-4 text-cyan-400"
                                            x-html="Icons.TrendingUp"></svg>
                                        <span
                                            class="text-xs font-bold text-cyan-300 uppercase tracking-wider">Recommended
                                            Level</span>
                                    </div>
                                    <p class="text-sm text-gray-200" x-text="current.requirements.recommendedLevel"></p>
                                </div>
                            </div>

                            <!-- Right Column: Gear & Espers -->
                            <div class="space-y-4">
                                <!-- Critical Gear -->
                                <div class="p-3 rounded-lg border border-yellow-500/30"
                                    style="background: rgba(40, 35, 20, 0.5)">
                                    <div class="flex items-center gap-2 mb-2">
                                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                            stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                            stroke-linejoin="round" class="w-4 h-4 text-yellow-400">
                                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                                        </svg>
                                        <span
                                            class="text-xs font-bold text-yellow-300 uppercase tracking-wider">Critical
                                            Gear</span>
                                    </div>
                                    <ul class="space-y-1">
                                        <template x-for="item in current.requirements.criticalGear" :key="item">
                                            <li class="text-xs text-gray-200 flex items-start gap-2">
                                                <span class="text-yellow-400 flex-shrink-0 mt-0.5">▸</span>
                                                <span x-text="item"></span>
                                            </li>
                                        </template>
                                    </ul>
                                </div>

                                <!-- Key Espers -->
                                <div class="p-3 rounded-lg border border-cyan-500/20"
                                    style="background: rgba(20, 35, 50, 0.5)">
                                    <div class="flex items-center gap-2 mb-2">
                                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                            stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                            stroke-linejoin="round" class="w-4 h-4 text-cyan-400"
                                            x-html="Icons.Sparkles"></svg>
                                        <span class="text-xs font-bold text-cyan-300 uppercase tracking-wider">Key
                                            Espers</span>
                                    </div>
                                    <ul class="space-y-1">
                                        <template x-for="esper in current.requirements.keyEspers" :key="esper">
                                            <li class="text-xs text-gray-200 flex items-start gap-2">
                                                <span class="text-cyan-400 flex-shrink-0 mt-0.5">✦</span>
                                                <span x-text="esper"></span>
                                            </li>
                                        </template>
                                    </ul>
                                </div>
                            </div>
                        </div>

                        <!-- Notes (Full Width) -->
                        <div x-show="current.requirements.notes"
                            class="mt-4 p-3 rounded-lg border border-yellow-500/30 bg-yellow-500/10">
                            <div class="flex items-start gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" class="w-4 h-4 text-yellow-400 flex-shrink-0 mt-0.5"
                                    x-html="Icons.AlertCircle"></svg>
                                <p class="text-xs text-gray-200 leading-relaxed" x-text="current.requirements.notes">
                                </p>
                            </div>
                        </div>
                    </div>

                    <!-- Party Compositions -->
                    <div x-show="current.parties" class="border-t border-cyan-500/20 pt-5">
                        <div class="flex items-center gap-2 mb-4">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                class="w-5 h-5 text-yellow-400">
                                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                                <circle cx="9" cy="7" r="4" />
                                <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
                                <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                            </svg>
                            <h4 class="text-sm font-bold text-yellow-300 uppercase tracking-wider">3-Person Party
                                Compositions</h4>
                        </div>
                        <div class="grid md:grid-cols-3 gap-3">
                            <template x-for="(party, pi) in current.parties" :key="party.name">
                                <button @click="selectedParty = pi; teamView = 'A'"
                                    class="rounded-lg p-3 border transition-all text-left" :class="{
                                        'border-yellow-500 bg-yellow-500/20 shadow-lg shadow-yellow-500/20': selectedParty === pi,
                                        'border-cyan-500/30 hover:border-cyan-500/50 hover:bg-cyan-500/10': selectedParty !== pi
                                    }" style="background: rgba(20, 35, 50, 0.5)">
                                    <div class="text-xs font-bold text-cyan-300 mb-1 uppercase tracking-wider"
                                        x-text="party.name"></div>
                                    <p class="text-[10px] text-gray-300 leading-relaxed" x-text="party.why"></p>
                                </button>
                            </template>
                        </div>
                    </div>
                </div>

                <!-- Team A/B Toggle -->
                <div x-show="current.parties && current.parties.length > 0" class="mb-6">
                    <div class="flex items-center justify-center gap-3">
                        <button @click="teamView = 'A'"
                            class="px-6 py-2.5 rounded-lg font-bold text-sm uppercase tracking-wider transition-all duration-200"
                            :class="{
                                'bg-yellow-500/20 border-2 border-yellow-500 text-yellow-300 shadow-lg shadow-yellow-500/20': teamView === 'A',
                                'bg-white/5 border border-gray-600 text-gray-400 hover:bg-white/10': teamView !== 'A'
                            }">
                            <div class="flex items-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" class="w-4 h-4">
                                    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                                    <circle cx="9" cy="7" r="4" />
                                    <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
                                    <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                                </svg>
                                <span>Team A</span>
                            </div>
                        </button>
                        <button @click="teamView = 'B'"
                            class="px-6 py-2.5 rounded-lg font-bold text-sm uppercase tracking-wider transition-all duration-200"
                            :class="{
                                'bg-green-500/20 border-2 border-green-500 text-green-300 shadow-lg shadow-green-500/20': teamView === 'B',
                                'bg-white/5 border border-gray-600 text-gray-400 hover:bg-white/10': teamView !== 'B'
                            }">
                            <div class="flex items-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" class="w-4 h-4">
                                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                                    <circle cx="9" cy="7" r="4" />
                                    <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                                    <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                                </svg>
                                <span>Team B</span>
                            </div>
                        </button>
                    </div>
                    <p class="text-center text-xs text-gray-400 mt-3" x-show="teamView === 'A'">
                        <span x-text="current.parties[selectedParty].name"></span> - Active combat party
                    </p>
                    <p class="text-center text-xs text-gray-400 mt-3" x-show="teamView === 'B'">
                        Leveling rotation - Switch in for experience distribution
                    </p>
                </div>

                <!-- Character Search/Filter -->
                <div x-show="current.builds" class="mb-8">
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <svg xmlns="http://www.w3.org/2000/svg"
                                class="h-5 w-5 text-cyan-400 opacity-50 group-focus-within:opacity-100 transition-opacity"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            </svg>
                        </div>
                        <input type="text" x-model="search" placeholder="Search characters, jobs, or roles..."
                            class="w-full bg-[#0a1a2a]/60 border border-cyan-500/30 rounded-lg pl-12 pr-4 py-4 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-cyan-500/50 focus:border-cyan-400 transition-all shadow-inner">
                    </div>
                </div>

                <template x-for="(build, i) in current.builds" :key="build.char + '-' + selectedParty">
                    <div x-show="shouldShowCharacter(build.char)" x-transition:enter="transition ease-out duration-300"
                        x-transition:enter-start="opacity-0 transform scale-95"
                        x-transition:enter-end="opacity-100 transform scale-100"
                        class="relative ff-panel rounded-lg overflow-visible transition-all duration-300 mb-4"
                        :class="expanded[i] ? 'ring-1 ring-cyan-500/30' : ''">

                        <button @click="expanded[i] = !expanded[i]"
                            class="w-full flex items-stretch text-left group relative min-h-[96px] pl-40 md:pl-60">

                            <!-- Overlapping Portrait - Refined Panoramic Slice -->
                            <div
                                class="absolute -left-2 md:-left-4 top-1/2 -translate-y-1/2 z-10 w-36 h-12 md:w-56 md:h-20 pointer-events-none transition-all duration-500">
                                <div class="ff-char-portrait-frame overflow-hidden">
                                    <img :src="CHAR_IMAGES[build.char]" :alt="build.char"
                                        class="w-full h-full object-cover scale-160 origin-center transition-transform duration-700"
                                        @error="$el.style.display = 'none'; $el.parentElement.classList.add('flex', 'items-center', 'justify-center', 'text-2xl', 'font-black', 'text-cyan-400'); $el.parentElement.innerText = build.char[0]" />
                                </div>
                            </div>

                            <!-- Info Section - Technical Hierarchy -->
                            <div class="flex-1 flex flex-col justify-center py-4 pr-6">
                                <div class="flex items-start justify-between">
                                    <div class="space-y-2">
                                        <div class="ff-char-name-punch ff-punch-text"
                                            :class="isLeader(build.char) ? 'ff-bronze-text' : ''" x-text="build.char">
                                        </div>
                                        <div class="flex flex-wrap items-center gap-3">
                                            <span
                                                class="text-[10px] font-black text-yellow-500 uppercase tracking-widest"
                                                x-text="build.role"></span>
                                            <div class="h-3 w-[1px] bg-white/10"></div>
                                            <!-- Job Badges - Restored Clarity -->
                                            <div class="flex flex-wrap gap-2">
                                                <template x-for="job in build.jobs" :key="job">
                                                    <div class="ff-job-tag-tech"
                                                        :style="`background-color: ${JOBS[job].color}25; border-color: ${JOBS[job].color}60; color: ${JOBS[job].color}`">
                                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                                            stroke-width="2" stroke-linecap="round"
                                                            stroke-linejoin="round" class="w-3.5 h-3.5"
                                                            x-html="Icons[JOBS[job].icon]"></svg>
                                                        <span x-text="job"></span>
                                                    </div>
                                                </template>
                                            </div>
                                        </div>
                                        <!-- Espers Node -->
                                        <div class="flex items-center gap-3 mt-2" x-show="build.espers.length > 0">
                                            <div class="flex gap-2">
                                                <template x-for="e in build.espers" :key="e">
                                                    <div class="ff-esper-glyph-box" :title="e">
                                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                                            stroke-width="1.5" stroke-linecap="round"
                                                            stroke-linejoin="round"
                                                            x-html="ZodiacGlyphs[ESPER_ZODIAC[e]]"></svg>
                                                    </div>
                                                </template>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="flex flex-col items-end justify-between self-stretch">
                                        <div class="flex items-center">
                                            <span class="ff-char-level-label">LV</span>
                                            <span class="ff-metric-value !text-3xl"
                                                x-text="(current.requirements.recommendedLevel.split('-')[1] || '99').replace(/[^0-9]/g, '')"></span>
                                        </div>
                                        <div
                                            class="text-[10px] opacity-20 group-hover:opacity-100 group-hover:translate-x-1 transition-all">
                                            <span x-text="expanded[i] ? '▲' : '▼'"></span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </button>

                        <!-- Expanded Details -->
                        <div x-show="expanded[i]" class="px-4 md:px-6 pb-6 border-t border-cyan-500/30"
                            style="background: rgba(10, 20, 30, 0.5)">
                            <div class="grid md:grid-cols-2 gap-6 pt-4">
                                <!-- Left Column: Strategy & Unlocks -->
                                <div class="space-y-6">
                                    <div>
                                        <div
                                            class="flex items-center gap-2 mb-3 text-sm font-bold text-cyan-300 uppercase tracking-wider">
                                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                                stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                                stroke-linejoin="round" class="w-4 h-4 text-yellow-400"
                                                x-html="Icons.Tactics"></svg>
                                            Strategy
                                        </div>
                                        <p class="text-sm text-white leading-relaxed p-4 rounded border border-cyan-500/20 shadow-sm font-normal"
                                            style="background: rgba(20, 35, 50, 0.6)" x-text="build.why"></p>
                                    </div>

                                    <div x-show="build.espers.length > 0">
                                        <div
                                            class="flex items-center gap-2 mb-4 text-sm font-bold text-cyan-300 uppercase tracking-wider">
                                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                                stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                                stroke-linejoin="round" class="w-4 h-4 text-cyan-400"
                                                x-html="Icons.Sparkles"></svg>
                                            Esper Unlocks
                                        </div>
                                        <div class="space-y-3">
                                            <template x-for="esper in build.espers" :key="esper">
                                                <div
                                                    class="relative p-4 rounded-lg border-2 border-cyan-400/40 bg-gradient-to-br from-cyan-500/15 via-cyan-500/10 to-transparent hover:border-cyan-400/60 hover:shadow-lg hover:shadow-cyan-500/20 transition-all">
                                                    <div class="flex items-start gap-3">
                                                        <!-- Circular Zodiac Icon -->
                                                        <div
                                                            class="flex-shrink-0 w-12 h-12 rounded-full border-2 border-cyan-400/70 bg-gradient-to-br from-cyan-500/40 to-cyan-600/30 flex items-center justify-center shadow-lg shadow-cyan-500/30">
                                                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                                                                fill="none" stroke="currentColor" stroke-linecap="round"
                                                                stroke-linejoin="round" class="w-6 h-6 text-cyan-300"
                                                                stroke-width="2.5"
                                                                x-html="ZodiacGlyphs[ESPER_ZODIAC[esper]]"></svg>
                                                        </div>
                                                        <!-- Esper Name & Unlocks -->
                                                        <div class="flex-1 min-w-0">
                                                            <div class="font-bold text-cyan-300 text-sm uppercase tracking-wider mb-2 flex items-center gap-2"
                                                                x-text="esper"></div>
                                                            <div class="space-y-1.5">
                                                                <template x-for="job in build.jobs" :key="job">
                                                                    <div x-show="ESPER_UNLOCKS[esper]?.[job]"
                                                                        class="text-xs bg-black/20 rounded px-2 py-1">
                                                                        <span class="font-bold text-white"
                                                                            x-text="job + ': '"></span>
                                                                        <span class="text-gray-300 font-normal"
                                                                            x-text="ESPER_UNLOCKS[esper]?.[job]"></span>
                                                                    </div>
                                                                </template>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                </div>

                                <!-- Right Column: Gambits & Gear -->
                                <div class="space-y-6">
                                    <div x-show="build.gambits">
                                        <div
                                            class="flex items-center gap-2 mb-3 text-sm font-bold text-cyan-300 uppercase tracking-wider">
                                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                                stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                                stroke-linejoin="round" class="w-4 h-4 text-yellow-400"
                                                x-html="Icons.GambitSystem"></svg>
                                            Gambits
                                        </div>
                                        <div class="p-3 rounded border border-cyan-500/20 shadow-sm font-mono text-[10px] leading-relaxed"
                                            style="background: rgba(20, 35, 50, 0.6)">
                                            <template x-for="(gambit, gi) in build.gambits" :key="gi">
                                                <div class="text-gray-200 mb-1.5 last:mb-0 flex items-start gap-2">
                                                    <span class="text-yellow-400 font-bold flex-shrink-0"
                                                        x-text="(gi + 1) + '.'"></span>
                                                    <span class="text-gray-300" x-text="gambit"></span>
                                                </div>
                                            </template>
                                        </div>
                                    </div>

                                    <div x-show="build.gear">
                                        <div
                                            class="flex items-center gap-2 mb-3 text-sm font-bold text-cyan-300 uppercase tracking-wider">
                                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                                stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                                stroke-linejoin="round" class="w-4 h-4 text-cyan-400">
                                                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                                            </svg>
                                            Recommended Gear
                                        </div>
                                        <div class="p-3 rounded border border-cyan-500/20 shadow-sm"
                                            style="background: rgba(20, 35, 50, 0.6)">
                                            <template x-for="(item, gi) in build.gear" :key="gi">
                                                <div
                                                    class="text-xs text-gray-200 mb-1.5 last:mb-0 flex items-start gap-2">
                                                    <span class="text-yellow-400 flex-shrink-0">▸</span>
                                                    <span class="text-gray-300" x-text="item"></span>
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>
            </div>

        </div>
    </div>
</body>

</html>
