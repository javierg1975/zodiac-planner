<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFXII Zodiac Planner</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: rgb(8, 15, 25);
            color: #ffffff;
            margin: 0;
            overflow-x: hidden;
        }

        /* FF XII Menu Background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url('./backgrounds/screenshot-337-cropped.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            filter: blur(8px);
            transform: scale(1.1);
            z-index: -1;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(5, 10, 20, 0.3);
            z-index: -1;
        }

        h1, h2, h3 { font-family: 'Inter', sans-serif; font-weight: 700; letter-spacing: -0.01em; }
        .fantasy-font { font-family: 'Inter', sans-serif; font-weight: 600; }

        /* FF XII Dark Panel - Blue-gray tint like actual game menus */
        .ff-panel {
            background: rgba(15, 25, 35, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 212, 255, 0.2);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .ff-panel:hover {
            background: rgba(20, 30, 42, 0.9);
            border-color: rgba(0, 212, 255, 0.3);
        }

        .teal-accent {
            color: #00d4ff;
        }

        .yellow-accent {
            color: #ffd700;
        }

        /* Custom Scrollbar - Yellow accent */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(10, 20, 30, 0.5); }
        ::-webkit-scrollbar-thumb { background: #ffd700; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #ffed4e; }
    </style>
</head>

        function FFXIIJobPlannerEstersand() {
            const [preset, setPreset] = useState('Max Efficiency');

                    </div>

                    <div className="max-w-7xl mx-auto px-6 py-8 flex flex-col lg:grid lg:grid-cols-12 lg:auto-rows-auto gap-8">

                        {/* Presets - Order 1 on mobile */}

                                    {Object.keys(PRESETS).map(p => (

                                    </div>

                                </div>
                            </div>

                            {current.builds.map((build, i) => (
                                <div
                                    key={build.char}
                                    className={`relative ff-panel rounded-lg overflow-visible transition-all duration-300 ${expanded[i] ? 'ring-2 ring-cyan-500/50 shadow-lg shadow-cyan-500/20' : ''}`}
                                    style={expanded[i] ? {background: 'rgba(15, 30, 45, 0.95)'} : {}}
                                >
                                    <button
                                        onClick={() => setExpanded(prev => ({ ...prev, [i]: !prev[i] }))}
                                        className="w-full flex items-stretch text-left group pl-20 md:pl-28 relative"
                                    >
                                        {/* Overlapping Portrait */}
                                        <div className="absolute -left-3 top-1/2 -translate-y-1/2 z-10 w-20 h-20 md:w-24 md:h-24 pointer-events-none">
                                            <div className="relative w-full h-full rounded overflow-hidden border-2 border-cyan-500/50 shadow-lg shadow-cyan-500/20" style={{background: 'linear-gradient(to bottom right, rgb(10, 20, 30), rgb(20, 30, 40))'}}>
                                                <img
                                                    src={CHAR_IMAGES[build.char]}
                                                    alt={build.char}
                                                    className="w-full h-full object-cover"
                                                    onError={(e) => {
                                                        e.target.style.display = 'none';
                                                        e.target.parentElement.classList.add('flex', 'items-center', 'justify-center', 'text-3xl', 'font-bold', 'text-cyan-400');
                                                        e.target.parentElement.innerText = build.char[0];
                                                    }}
                                                />
                                            </div>
                                        </div>

                                        {/* Info Section */}
                                        <div className="flex-1 flex flex-col justify-between py-3 pr-4 pl-4 md:py-4 md:pr-6 md:pl-6">
                                            <div>
                                                <div className="flex items-center gap-2 mb-2">
                                                    <h2 className="text-2xl md:text-3xl font-bold text-white leading-none tracking-tight">{build.char}</h2>
                                                    <span className="text-[10px] font-bold text-yellow-400 uppercase tracking-wider bg-yellow-500/10 px-2 py-0.5 rounded border border-yellow-500/30">{build.role}</span>
                                                </div>
                                            </div>

                                            <div className="flex justify-between items-end">
                                                <div className="flex-1">
                                                    {/* Job Badges - Dark Theme */}
                                                    <div className="flex flex-wrap gap-2">
                                                        {build.jobs.map(job => {
                                                            const j = JOBS[job];
                                                            const Icon = j.icon;
                                                            return (
                                                                <div key={job}
                                                                    className="flex items-center gap-2 pl-2 pr-3 py-1.5 rounded border text-sm font-semibold shadow-sm"
                                                                    style={{
                                                                        backgroundColor: 'rgba(10, 20, 30, 0.6)',
                                                                        borderColor: j.color + '60',
                                                                        color: j.color
                                                                    }}
                                                                >
                                                                    <Icon className="w-4 h-4" />
                                                                    {job}
                                                                </div>
                                                            );
                                                        })}
                                                    </div>

                                                    {/* Espers Mini-list (Collapsed View) */}
                                                    {!expanded[i] && build.espers.length > 0 && (
                                                        <div className="flex flex-wrap gap-1 mt-2">
                                                            {build.espers.map(e => (
                                                                <span key={e} className="text-[10px] font-semibold text-gray-300 px-1.5 py-0.5 rounded border border-gray-600" style={{background: 'rgba(10, 20, 30, 0.6)'}}>
                                                                    {e}
                                                                </span>
                                                            ))}
                                                        </div>
                                                    )}
                                                </div>

                                                <div className={`p-2 rounded-full transition-colors self-start ${expanded[i] ? 'bg-cyan-500/20 text-cyan-400' : 'text-gray-500 group-hover:text-gray-400'}`}>
                                                    {expanded[i] ? <Icons.ChevronUp className="w-5 h-5" /> : <Icons.ChevronDown className="w-5 h-5" />}
                                                </div>
                                            </div>
                                        </div>
                                    </button>

                                    {/* Expanded Details */}
                                    {expanded[i] && (
                                        <div className="px-4 md:px-6 pb-6 border-t border-cyan-500/30" style={{background: 'rgba(10, 20, 30, 0.5)'}}>
                                            <div className="grid md:grid-cols-2 gap-6 pt-4">
                                                <div>
                                                    <div className="flex items-center gap-2 mb-3 text-sm font-bold text-cyan-300 uppercase tracking-wider">
                                                        <Icons.Crown className="w-4 h-4 text-yellow-400" /> Strategy
                                                    </div>
                                                    <p className="text-sm text-white leading-relaxed p-4 rounded border border-cyan-500/20 shadow-sm font-normal" style={{background: 'rgba(20, 35, 50, 0.6)'}}>
                                                        {build.why}
                                                    </p>
                                                </div>

                                                {build.espers.length > 0 && (
                                                    <div>
                                                        <div className="flex items-center gap-2 mb-3 text-sm font-bold text-cyan-300 uppercase tracking-wider">
                                                            <Icons.Sparkles className="w-4 h-4 text-cyan-400" /> Unlocks
                                                        </div>
                                                        <div className="space-y-2">
                                                            {build.espers.map(esper => (
                                                                <div key={esper} className="flex items-start gap-3 text-xs p-2 rounded hover:bg-white/5 transition-colors">
                                                                    <span className="font-bold text-cyan-300 min-w-[80px] pt-0.5 uppercase tracking-wider">{esper}</span>
                                                                    <div className="flex-1">
                                                                        {build.jobs.map(job =>
                                                                            ESPER_UNLOCKS[esper]?.[job] ? (
                                                                                <div key={job} className="mb-0.5">
                                                                                    <span className="font-bold text-white">{job}: </span>
                                                                                    <span className="text-gray-300 font-normal">{ESPER_UNLOCKS[esper][job]}</span>
                                                                                </div>
                                                                            ) : null
                                                                        )}
                                                                    </div>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            ))}
                        </div>

                        {/* Esper Grid - Order 3 on mobile (bottom), col-span-4 on desktop (left column, row 2) */}
                        <div className="order-3 lg:col-span-4 lg:col-start-1 lg:order-none">
                            <div className="ff-panel rounded-lg p-6">
                                <h3 className="text-lg text-cyan-400 mb-4 flex items-center gap-2 font-bold tracking-tight">
                                    <Icons.Sparkles className="w-5 h-5" /> Zodiac Espers
                                </h3>

                                {/* Group espers by character */}
                                <div className="space-y-4">
                                    {current.builds.map(build => {
                                        if (build.espers.length === 0) return null;

                                        return (
                                            <div key={build.char}>
                                                <div className="text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">{build.char}</div>
                                                <div className="grid grid-cols-3 gap-2">
                                                    {build.espers.map(esper => {
                                                        const isHovered = hoveredEsper === esper;

                                                        return (
                                                            <div
                                                                key={esper}
                                                                onMouseEnter={() => setHoveredEsper(esper)}
                                                                onMouseLeave={() => setHoveredEsper(null)}
                                                                className={`relative aspect-square rounded flex flex-col items-center justify-center p-2 text-center border transition-all cursor-help bg-cyan-500/30 border-cyan-500 text-cyan-200 shadow-lg shadow-cyan-500/20
                                                                    ${isHovered ? 'scale-105 z-10 ring-2 ring-cyan-400' : ''}
                                                                `}
                                                            >
                                                                <ZodiacIcon sign={ESPER_ZODIAC[esper]} className="w-8 h-8 mb-1" />
                                                                <div className="text-[9px] font-bold uppercase tracking-wider truncate w-full">{esper}</div>

                                                                {/* Tooltip */}
                                                                {isHovered && (
                                                                    <div className="absolute bottom-full mb-2 left-1/2 -translate-x-1/2 w-56 border border-cyan-500/50 rounded-lg p-3 shadow-xl z-50 text-left pointer-events-none text-white backdrop-blur" style={{background: 'rgba(10, 20, 30, 0.95)'}}>
                                                                        <div className="text-cyan-400 font-bold text-xs mb-2 border-b border-gray-700 pb-1 uppercase flex items-center gap-2">
                                                                            <ZodiacIcon sign={ESPER_ZODIAC[esper]} className="w-5 h-5" />
                                                                            {esper}
                                                                        </div>
                                                                        {Object.entries(ESPER_UNLOCKS[esper]).map(([job, unlock]) => (
                                                                            <div key={job} className="mb-1 text-[10px] leading-snug">
                                                                                <span className="font-bold text-gray-200 block">{job}</span>
                                                                                <span className="text-gray-400 font-normal">{unlock}</span>
                                                                            </div>
                                                                        ))}
                                                                    </div>
                                                                )}
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        );
                                    })}

                                    {/* Unassigned Espers */}
                                    {(() => {
                                        const assignedEspers = current.builds.flatMap(b => b.espers);
                                        const unassignedEspers = Object.keys(ESPER_UNLOCKS).filter(e => !assignedEspers.includes(e));

                                        if (unassignedEspers.length === 0) return null;

                                        return (
                                            <div>
                                                <div className="text-xs font-bold text-gray-500 mb-2 uppercase tracking-wider">Unassigned</div>
                                                <div className="grid grid-cols-3 gap-2">
                                                    {unassignedEspers.map(esper => {
                                                        const isHovered = hoveredEsper === esper;

                                                        return (
                                                            <div
                                                                key={esper}
                                                                onMouseEnter={() => setHoveredEsper(esper)}
                                                                onMouseLeave={() => setHoveredEsper(null)}
                                                                className={`relative aspect-square rounded flex flex-col items-center justify-center p-2 text-center border transition-all cursor-help border-gray-700 text-gray-600
                                                                    ${isHovered ? 'scale-105 z-10 ring-2 ring-gray-500' : ''}
                                                                `}
                                                                style={{background: 'rgba(15, 25, 35, 0.5)'}}
                                                            >
                                                                <ZodiacIcon sign={ESPER_ZODIAC[esper]} className="w-8 h-8 mb-1 opacity-40" />
                                                                <div className="text-[9px] font-bold uppercase tracking-wider truncate w-full">{esper}</div>

                                                                {/* Tooltip */}
                                                                {isHovered && (
                                                                    <div className="absolute bottom-full mb-2 left-1/2 -translate-x-1/2 w-56 border border-gray-600 rounded-lg p-3 shadow-xl z-50 text-left pointer-events-none text-white backdrop-blur" style={{background: 'rgba(10, 20, 30, 0.95)'}}>
                                                                        <div className="text-gray-400 font-bold text-xs mb-2 border-b border-gray-700 pb-1 uppercase flex items-center gap-2">
                                                                            <ZodiacIcon sign={ESPER_ZODIAC[esper]} className="w-5 h-5" />
                                                                            {esper}
                                                                        </div>
                                                                        {Object.entries(ESPER_UNLOCKS[esper]).map(([job, unlock]) => (
                                                                            <div key={job} className="mb-1 text-[10px] leading-snug">
                                                                                <span className="font-bold text-gray-200 block">{job}</span>
                                                                                <span className="text-gray-400 font-normal">{unlock}</span>
                                                                            </div>
                                                                        ))}
                                                                    </div>
                                                                )}
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        );
                                    })()}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<FFXIIJobPlannerEstersand />);
    </script>
</body>
</html>
